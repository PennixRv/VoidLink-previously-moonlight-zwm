name: Build VoidLink tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "Integration" ]

jobs:
  build_tvos:
    name: Build tvOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode Version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: List Xcode Schemes
        run: xcodebuild -project VoidLink.xcodeproj -list

      - name: Xcodebuild (tvOS)
        run: |
          set -euo pipefail
          DERIVED_DATA="$PWD/build/DerivedData"
          mkdir -p "$PWD/build/tvos"
          xcodebuild -verbose -project VoidLink.xcodeproj -scheme VoidLinkTV -sdk appletvos -configuration Debug -destination 'generic/platform=tvOS' -derivedDataPath "$DERIVED_DATA" archive -archivePath "$PWD/build/tvos/VoidLinkTV.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO" 2>&1 | tee "$PWD/build/tvos/xcodebuild.log"
          mkdir -p ./build/tvos/IPA/Payload
          cp -r ./build/tvos/VoidLinkTV.xcarchive/Products/Applications/VoidLinkTV.app ./build/tvos/IPA/Payload/VoidLinkTV.app

          # Ensure dynamic SwiftPM frameworks are embedded via the Xcode project (Embed Frameworks build phase),
          # otherwise dyld can terminate the app before main() runs.
          APP="./build/tvos/IPA/Payload/VoidLinkTV.app"
          test -f "$APP/Frameworks/OpenSSL.framework/OpenSSL"

          python3 ./BuildScripts/weaklink_opengles.py "$APP/VoidLinkTV"

          # Hard gate: ensure nothing in the bundle references legacy OpenGL ES symbols.
          # Newer tvOS builds can remove these symbols from system frameworks, causing dyld to
          # terminate the app before main() runs.
          FOUND_GL=0
          while IFS= read -r -d '' F; do
            if file "$F" | grep -q "Mach-O"; then
              # nm output can contain "non-external _global_*" etc. Match only undefined, external OpenGL-style symbols.
              if nm -m "$F" 2>/dev/null | grep -nE "\\(undefined\\) external _gl[A-Z][A-Za-z0-9_]+" >/dev/null; then
                echo "Forbidden OpenGL symbol reference detected in: $F"
                nm -m "$F" 2>/dev/null | grep -nE "\\(undefined\\) external _gl[A-Z][A-Za-z0-9_]+" | head -n 60 || true
                FOUND_GL=1
              fi
              if nm -m "$F" 2>/dev/null | grep -nE "EAGLContext" >/dev/null; then
                echo "Forbidden EAGLContext reference detected in: $F"
                nm -m "$F" 2>/dev/null | grep -nE "EAGLContext" | head -n 40 || true
                FOUND_GL=1
              fi
            fi
          done < <(find "$APP" -type f -perm -111 -print0)
          test "$FOUND_GL" -eq 0

          # Hard gate: ensure nothing in the bundle strongly links forbidden legacy graphics/audio frameworks.
          FORBIDDEN_REGEX="OpenGLES\\.framework|GLKit\\.framework|OpenAL\\.framework"
          FOUND=0
          while IFS= read -r -d '' F; do
            if file "$F" | grep -q "Mach-O"; then
              if otool -L "$F" | grep -nE "$FORBIDDEN_REGEX" >/dev/null; then
                echo "Forbidden linkage detected in: $F"
                otool -L "$F" | grep -nE "$FORBIDDEN_REGEX" || true
                FOUND=1
              fi
            fi
          done < <(find "$APP" -type f -perm -111 -print0)
          test "$FOUND" -eq 0

          cd ./build/tvos/IPA && zip -r ../VoidLink-tvOS.ipa ./Payload && cd ../..

      - name: Upload tvOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-tvOS.ipa
          path: build/tvos/VoidLink-tvOS.ipa

      - name: Upload tvOS dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: VoidLinkTV.dSYMs
          path: build/tvos/VoidLinkTV.xcarchive/dSYMs

      - name: Upload Xcodebuild Log
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild.log
          path: build/tvos/xcodebuild.log
