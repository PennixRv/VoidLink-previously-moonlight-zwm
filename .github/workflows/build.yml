name: Build VoidLink tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "Integration" ]

jobs:
  build_tvos:
    name: Build tvOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: List Xcode Schemes
        run: xcodebuild -project VoidLink.xcodeproj -list

      - name: Xcodebuild (tvOS)
        run: |
          DERIVED_DATA="$PWD/build/DerivedData"
          xcodebuild -verbose -project VoidLink.xcodeproj -scheme VoidLinkTV -sdk appletvos -configuration Debug -destination 'generic/platform=tvOS' -derivedDataPath "$DERIVED_DATA" archive -archivePath "$PWD/build/tvos/VoidLinkTV.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO"
          mkdir -p ./build/tvos/IPA/Payload
          cp -r ./build/tvos/VoidLinkTV.xcarchive/Products/Applications/VoidLinkTV.app ./build/tvos/IPA/Payload/VoidLinkTV.app

          # Ensure dynamic SwiftPM frameworks are embedded via the Xcode project (Embed Frameworks build phase),
          # otherwise dyld can terminate the app before main() runs.
          APP="./build/tvos/IPA/Payload/VoidLinkTV.app"
          test -f "$APP/Frameworks/OpenSSL.framework/OpenSSL"

          python3 ./BuildScripts/weaklink_opengles.py ./build/tvos/IPA/Payload/VoidLinkTV.app/VoidLinkTV
          cd ./build/tvos/IPA && zip -r ../VoidLink-tvOS.ipa ./Payload && cd ../..

      - name: Upload tvOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-tvOS.ipa
          path: build/tvos/VoidLink-tvOS.ipa
